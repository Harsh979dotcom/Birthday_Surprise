<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the page fit properly on mobile phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One More Step ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top, #ff9a9e, transparent 45%),
                linear-gradient(135deg, #667eea, #764ba2);

            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .box {
            width: 88%;
            max-width: 520px;

            padding: 35px 20px;

            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 28px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        h2 {
            font-size: 21px;
            margin-top: 25px;
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 30px;

            padding: 15px 22px;
            margin: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                left 0.25s ease,
                top 0.25s ease;
        }

        #correctButton {
            background: white;
            color: #764ba2;

            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }

        #correctButton:hover {
            transform: scale(1.08);
        }

        .wrongButton {
            background: rgba(60,60,60,0.8);
            color: white;

            position: fixed;

            z-index: 10;
        }

        .heart {
            position: fixed;
            pointer-events: none;

            animation: floatUp 4s linear forwards;

            font-size: 20px;
        }

        @keyframes floatUp {

            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }

        }

        @media (max-width: 500px) {

            h1 {
                font-size: 29px;
            }

            p {
                font-size: 17px;
            }

            h2 {
                font-size: 19px;
            }

            button {
                padding: 14px 19px;
                font-size: 15px;
            }

        }

    </style>
</head>


<body>

    <div class="box">

        <h1>Hmm... you made it here 👀</h1>

        <p>
            Okay... you passed the first test. ❤️
        </p>

        <h2>
            How badly do you want to know the surprise?
        </h2>

        <div class="buttons">

            <!-- WRONG OPTION 1 -->
            <button
                id="wrong1"
                class="wrongButton">
                Not really 😐
            </button>


            <!-- CORRECT OPTION -->
            <button
                id="correctButton"
                onclick="goToNextPage()">
                I REALLY WANT TO KNOW ❤️
            </button>


            <!-- WRONG OPTION 2 -->
            <button
                id="wrong2"
                class="wrongButton">
                Maybe a little 🤔
            </button>

        </div>

    </div>


<script>

    const wrong1 = document.getElementById("wrong1");
    const wrong2 = document.getElementById("wrong2");

    let attempts1 = 0;
    let attempts2 = 0;


    /*
       This function moves a button
       somewhere inside the visible screen.
    */

    function moveButton(button) {

        const padding = 15;

        const maxX =
            window.innerWidth -
            button.offsetWidth -
            padding;

        const maxY =
            window.innerHeight -
            button.offsetHeight -
            padding;

        const minX = padding;
        const minY = padding;

        const randomX =
            Math.random() * (maxX - minX) + minX;

        const randomY =
            Math.random() * (maxY - minY) + minY;

        button.style.left = randomX + "px";
        button.style.top = randomY + "px";
    }


    /*
       WRONG BUTTON 1
    */

    function runAway1(event) {

        if (event) {
            event.preventDefault();
        }

        attempts1++;

        moveButton(wrong1);

        if (attempts1 === 1) {
            wrong1.innerText = "Nope 😂";
        }

        else if (attempts1 === 2) {
            wrong1.innerText = "Nice try 😏";
        }

        else if (attempts1 === 3) {
            wrong1.innerText = "You can't escape ❤️";
        }

        else if (attempts1 >= 4) {
            wrong1.innerText = "Just press the ❤️ button!";
        }

        createHeart();
    }


    /*
       WRONG BUTTON 2
    */

    function runAway2(event) {

        if (event) {
            event.preventDefault();
        }

        attempts2++;

        moveButton(wrong2);

        if (attempts2 === 1) {
            wrong2.innerText = "Think again 😂";
        }

        else if (attempts2 === 2) {
            wrong2.innerText = "Almost... NOT 😏";
        }

        else if (attempts2 === 3) {
            wrong2.innerText = "Still trying? 😂";
        }

        else if (attempts2 >= 4) {
            wrong2.innerText = "You know which one to press ❤️";
        }

        createHeart();
    }


    /*
       Desktop:
       The buttons move when the mouse
       gets close to them.
    */

    wrong1.addEventListener(
        "mouseover",
        runAway1
    );

    wrong2.addEventListener(
        "mouseover",
        runAway2
    );


    /*
       Mobile:
       The buttons move when touched.
    */

    wrong1.addEventListener(
        "touchstart",
        runAway1,
        { passive: false }
    );

    wrong2.addEventListener(
        "touchstart",
        runAway2,
        { passive: false }
    );


    /*
       Extra protection:
       If someone actually manages to click
       the wrong button, it runs away again.
    */

    wrong1.addEventListener(
        "click",
        runAway1
    );

    wrong2.addEventListener(
        "click",
        runAway2
    );


    /*
       Correct button:
       Opens the next page.
    */

    function goToNextPage() {

        createHeart();

        setTimeout(function() {

            location.href = "final.html";

        }, 500);

    }


    /*
       Floating heart effect ❤️
    */

    function createHeart() {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerText = "❤️";

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.bottom = "-30px";

        heart.style.fontSize =
            (15 + Math.random() * 20) + "px";

        document.body.appendChild(heart);


        setTimeout(function() {

            heart.remove();

        }, 4000);

    }


    /*
       Give the two wrong buttons
       starting positions.
    */

    window.addEventListener("load", function() {

        wrong1.style.left = "15%";
        wrong1.style.top = "65%";

        wrong2.style.left = "60%";
        wrong2.style.top = "75%";

    });


    /*
       Keep buttons inside the screen
       if the phone is rotated.
    */

    window.addEventListener("resize", function() {

        moveButton(wrong1);
        moveButton(wrong2);

    });

</script>

</body>

</html>
